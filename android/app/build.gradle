plugins { id 'com.android.application' }

android {
    namespace 'dev.prismengine.runtime'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.prismengine.demo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        externalNativeBuild { cmake {
            cppFlags '-std=c++20 -fexceptions -frtti -O2 -fvisibility=hidden'
            arguments '-DANDROID_STL=c++_shared'
        } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        if (System.getenv('PRISM_KEYSTORE')) {
            prismRelease {
                storeFile file(System.getenv('PRISM_KEYSTORE'))
                storePassword System.getenv('PRISM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PRISM_KEY_ALIAS')
                keyPassword System.getenv('PRISM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release APK requires PRISM_KEYSTORE + PRISM_KEYSTORE_PASSWORD + PRISM_KEY_ALIAS + PRISM_KEY_PASSWORD.
            if (System.getenv('PRISM_KEYSTORE')) signingConfig signingConfigs.prismRelease
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt') version '3.22.1' } }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
